<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet" type="text/css" href="public/styles/main.css">
       <link rel ="stylesheet" type="text/css" href="public/styles/home.css">
    <title>home</title>
</head>
<body class="home-page">
    <div class="app-container">
        <div class="app-container">
            <aside class="sidebar">
                <header class="header">
                    <div class="logo-container">
                        <img src="public/uploaded/logo.png" alt="Logo" class="logo-icon">
                        <span class="logo-text">MyAdventure</span>
                    </div>
                    <hr class="header-divider">
                </header>
                <div class="sidebar-content">
                    <div class="user-profile">
                        <span class="user-name">John Doe</span>
                        <span class="user-email">john.doe@email.com</span>
                    </div>
                    <nav class="side-nav">
                        <a href="#" class="nav-item active">
                            <span class="icon">🗺️</span> My Trips
                        </a>
                        <a href="#" class="nav-item">
                            <span class="icon">📊</span> Stats
                        </a>
                                
                        <button class="btn-add-trip">Add New Trip</button>
                    </nav>
                </div>
                <div class="side-bottom">
                    <a href="#" class="nav-item">
                        <span class="icon">⚙️</span> Settings
                    </a>
                    <a href="#" class="nav-item logout">
                        <span class="icon">🚪</span> Logout
                    </a>
                </div>
            </aside>
            <main class="main-content">
                    <h1>My Adventures</h1>
                    
                    <div class="trips-container">
                        <div class="trip-card">
                            <div class="trip-details">
                                <h3>Hike to Mount Evans</h3>
                                <p class="trip-info">12.5 km • 1,200 m</p>
                                <span class="trip-date">July 15, 2023</span>
                            </div>
                            <div class="trip-map-preview">
                                <img src="public/uploaded/map-placeholder.png" alt="Map View">
                            </div>
                        </div>

                        <div class="trip-card">
                            <div class="trip-details">
                                <h3>Sunrise at Pikes Peak</h3>
                                <p class="trip-info">8.2 km • 950 m</p>
                                <span class="trip-date">June 28, 2023</span>
                            </div>
                            <div class="trip-map-preview">
                                <img src="public/uploaded/map-placeholder.png" alt="Map View">
                            </div>
                        </div>
                    </div>
            </main>
        </div>
    </div>
</body>
</html>
